# Model configuration
model:
  name: "mlp"
  params:
    in_channels: 12
    out_channels: 1
    features: [32, 64, 128, 256]     # hidden layers' units
    activation: "relu"
    last_activation: "relu"

# Preprocessing configuration
preprocess:
  missing_values:         # mean    | dropout
  encoding:               # one_hot | ordinal
  normalization: z_norm   # z_norm  | minmax 

# Dataset split configuration
split:
  split_seed: 49
  test_size: 0.2
  fold_n: 5    # for K-fold Cross Validation

# Training configuration
training:
  num_epochs: 200
  val_split: 0.2
  
  # Hyper parameters
  hyperparams:
    search_method: "random"   # grid | random
    search_num: 10

    learning_rates: [0.001, 0.005]
    batch_size:
      - 32
    optimizers:
      - "adam"
      - "adamw"
      - "adagrad"

  # Early stopping
  early_stopping:
    early_stopping_patience: 15
    monitor_metric: "val_loss"
    min_delta: 0.001

  # Model checkpoint
  checkpoint:
    monitor_metric: "val_loss"
    verbose: 1
    save_best_only: true
    save_weights_only: true
    save_freq: "epoch"

# Evaluation configuration
eval:
  loss: "mse"
  metrics:
    - "RootMeanSquaredError"
    - "mae"
    - "R2Score"

log_dir:  "runs/Experiments"
ckpt_dir: "checkpoints/Experiments"